name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check cf_access_alert/ run.py tests/

      - name: Compile check (syntax errors)
        run: python -m py_compile run.py && python -m compileall -q cf_access_alert/

      - name: Import check (module resolution)
        run: |
          python -c "from cf_access_alert import main, config, cloudflare, notifications, burst, digest, state, shutdown, timeutil, updater, healthcheck, banner"
          python -c "from cf_access_alert.channels import ALL_CHANNELS; from cf_access_alert.channels.base import NotificationChannel; from cf_access_alert.channels.pushover import PushoverChannel; from cf_access_alert.channels.discord import DiscordChannel; from cf_access_alert.channels.ntfy import NtfyChannel"

      - name: Pytest
        run: pytest tests/ -v
